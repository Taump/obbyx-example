allowBuilds:
  esbuild: true
  secp256k1: true
# One copy of @x402/core for everyone (@obbyx/* and @x402/*), or their types and
# runtime objects do not match.
overrides:
  '@x402/core': 2.30.0
minimumReleaseAgeExclude:
  - '@obbyx/cli@0.1.5'
  - '@obbyx/obyte@0.2.0'
  - '@obbyx/sdk@0.3.0'
  - '@obbyx/x402-obyte@0.3.0'
  - '@x402/core@2.30.0'
  - '@x402/express@2.30.0'
  - '@x402/extensions@2.30.0'
  - '@x402/fetch@2.30.0'
